<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>botpanel</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="beacon" id="beacon" data-state="stopped">
        <span class="ring"></span>
        <span class="core"></span>
      </div>
      <span class="mark-text">botpanel</span>
      <span class="status-line">— <span class="status-word" id="status-word">STOPPED</span></span>
    </div>
    <button class="logout-btn" id="logout-btn">Sign out</button>
  </header>

  <main class="container">

    <section class="panel">
      <div class="panel-header"><h2>Control</h2></div>
      <div class="panel-body">
        <div class="controls-row">
          <button class="btn btn-start" id="start-btn">▶ Start</button>
          <button class="btn btn-stop" id="stop-btn">■ Stop</button>
          <button class="btn btn-restart" id="restart-btn">↻ Restart</button>
          <span class="cmd-tag" id="cmd-tag">—</span>
        </div>
        <div class="meta-grid">
          <div class="meta-item">
            <div class="label">PID</div>
            <div class="value" id="meta-pid">—</div>
          </div>
          <div class="meta-item">
            <div class="label">Uptime</div>
            <div class="value" id="meta-uptime">—</div>
          </div>
          <div class="meta-item">
            <div class="label">Restarts</div>
            <div class="value" id="meta-restarts">0</div>
          </div>
          <div class="meta-item">
            <div class="label">Working dir</div>
            <div class="value" id="meta-cwd">—</div>
          </div>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2>Log stream</h2>
        <div class="log-toolbar">
          <button id="log-pause">Pause</button>
          <button id="log-clear">Clear</button>
        </div>
      </div>
      <div class="panel-body">
        <div id="log-stream" aria-live="polite"></div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-header"><h2>Config (config.json)</h2></div>
      <div class="panel-body">
        <textarea class="config-textarea" id="config-textarea" spellcheck="false" placeholder="No config.json found in bot directory yet."></textarea>
        <div class="config-footer">
          <button class="btn" id="config-save">Save changes</button>
          <span class="config-status" id="config-status"></span>
        </div>
      </div>
    </section>

  </main>

  <div class="toast" id="toast"></div>

  <script src="/app.js"></script>
</body>
</html>
