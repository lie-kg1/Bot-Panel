<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Forgot Password · Bot Panel</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
    background:
      radial-gradient(ellipse at 20% 100%, rgba(120, 80, 60, 0.35), transparent 55%),
      radial-gradient(ellipse at 80% 100%, rgba(60, 50, 90, 0.35), transparent 55%),
      linear-gradient(180deg, #0d0f1c 0%, #12111f 40%, #17141f 100%);
    color: #e8e8ec;
    position: relative;
    overflow: hidden;
  }

  .stars {
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(1.5px 1.5px at 20px 30px, rgba(255,255,255,0.6), transparent),
      radial-gradient(1px 1px at 90px 80px, rgba(255,255,255,0.5), transparent),
      radial-gradient(1.5px 1.5px at 150px 20px, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 220px 120px, rgba(255,255,255,0.5), transparent),
      radial-gradient(1.5px 1.5px at 300px 60px, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 400px 40px, rgba(255,255,255,0.5), transparent),
      radial-gradient(1.5px 1.5px at 480px 100px, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 550px 20px, rgba(255,255,255,0.5), transparent),
      radial-gradient(1.5px 1.5px at 650px 70px, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 750px 30px, rgba(255,255,255,0.5), transparent),
      radial-gradient(1.5px 1.5px at 850px 90px, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 950px 50px, rgba(255,255,255,0.5), transparent),
      radial-gradient(1.5px 1.5px at 1050px 110px, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 1150px 25px, rgba(255,255,255,0.5), transparent);
    background-repeat: repeat;
    background-size: 1200px 200px;
    opacity: 0.8;
  }

  .mountains {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 45%;
    z-index: 0;
    opacity: 0.9;
  }

  .card {
    position: relative;
    z-index: 2;
    width: 340px;
    background: rgba(15, 14, 24, 0.55);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 18px;
    padding: 34px 32px 28px;
    backdrop-filter: blur(6px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    text-align: center;
  }

  .logo {
    width: 96px;
    height: 96px;
    margin: 0 auto 18px;
    display: block;
  }

  .brand {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 4px;
    letter-spacing: 0.2px;
  }

  .tagline {
    font-size: 13px;
    color: #8b7ea8;
    margin-bottom: 26px;
  }

  label {
    display: block;
    text-align: left;
    font-size: 13px;
    color: #cfcfd6;
    margin-bottom: 6px;
  }

  .field-wrap { position: relative; }

  input[type="email"] {
    width: 100%;
    background: rgba(10, 10, 20, 0.6);
    border: 1px solid rgba(120, 130, 200, 0.35);
    border-radius: 8px;
    padding: 11px 12px;
    font-size: 14px;
    color: #f0f0f5;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  input:focus {
    border-color: #5b8def;
    box-shadow: 0 0 0 3px rgba(91, 141, 239, 0.2);
  }

  input::placeholder { color: #6f6f80; }

  .btn {
    width: 100%;
    border: none;
    border-radius: 9px;
    padding: 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 22px;
    color: #fff;
    transition: filter 0.15s ease, transform 0.1s ease;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: translateY(1px); }

  .btn-reset {
    background: linear-gradient(90deg, #3f6fd6, #5f8de8);
  }

  .footer-row {
    margin-top: 16px;
    font-size: 12.5px;
  }
  .footer-row a {
    color: #7fa5f0;
    text-decoration: none;
  }
  .footer-row a:hover { text-decoration: underline; }
</style>
</head>
<body>

  <svg class="mountains" viewBox="0 0 1440 400" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <polygon points="0,400 0,260 180,120 340,240 500,90 680,220 820,60 1000,210 1180,130 1300,230 1440,150 1440,400"
      fill="#1c1a28"/>
    <polygon points="0,400 0,320 220,210 420,300 620,180 800,290 980,190 1180,280 1440,220 1440,400"
      fill="#141220" opacity="0.85"/>
  </svg>
  <div class="stars"></div>

  <div class="card">
    <svg class="logo" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="nGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#c53fd1"/>
          <stop offset="45%" stop-color="#8b4de0"/>
          <stop offset="100%" stop-color="#3fa9e0"/>
        </linearGradient>
      </defs>
      <path d="M40 160 L40 45 Q40 35 50 35 Q58 35 63 42 L140 150 L140 45 Q140 35 150 35 Q160 35 160 45 L160 155 Q160 165 150 165 Q142 165 137 158 L60 50 L60 155 Q60 165 50 165 Q40 165 40 160 Z"
        fill="url(#nGrad)"/>
    </svg>

    <div class="brand">Forgot Password</div>
    <div class="tagline">We'll email you a reset link</div>

    <form id="forgot-form">
      <label for="email">Email</label>
      <div class="field-wrap">
        <input type="email" id="email" placeholder="you@example.com">
      </div>

      <button type="submit" class="btn btn-reset">Send Reset Link</button>
      <p id="forgot-note" style="color:#cfcfd6; font-size:12.5px; margin:12px 0 0; display:none;">
        Password resets aren't wired up on this server yet — ask your panel admin to reset it for you.
      </p>
    </form>

    <div class="footer-row">
      <a href="/login.html">Back to login</a>
    </div>
  </div>

  <script>
    document.getElementById('forgot-form').addEventListener('submit', (e) => {
      e.preventDefault();
      document.getElementById('forgot-note').style.display = 'block';
    });
  </script>

</body>
</html>
