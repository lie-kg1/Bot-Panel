<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>botpanel — sign in</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap');

    :root {
      --bg-main: #14161f;
      --bg-card: #191c28;
      --line: #272b3a;
      --text-primary: #e7e9f0;
      --text-dim: #7b8093;
      --text-faint: #4d5266;
      --accent: #4c7cf1;
      --accent-hover: #6690f5;
      --font-ui: 'Nunito Sans', system-ui, -apple-system, sans-serif;
      --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: var(--bg-main) !important;
      color: var(--text-primary) !important;
      font-family: var(--font-ui);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 380px;
    }

    .login-card h1 {
      margin: 0 0 6px 0;
      font-size: 20px;
      font-weight: 800;
      color: var(--text-primary);
    }

    .login-card p {
      color: var(--text-dim);
      font-size: 14px;
      margin: 0 0 22px 0;
    }

    .form-group { margin-bottom: 20px; }

    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-faint);
      margin-bottom: 6px;
    }

    .input-field {
      width: 100%;
      padding: 10px 12px;
      background: #0e1019;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--text-primary);
      font-family: var(--font-mono);
      outline: none;
      transition: border-color 0.12s ease;
    }

    .input-field:focus { border-color: var(--accent); }

    .btn-primary {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      font-size: 13px;
      font-weight: 700;
      padding: 10px 16px;
      border-radius: 7px;
      cursor: pointer;
      transition: background 0.12s ease;
    }

    .btn-primary:hover { background: var(--accent-hover); }
  </style>
</head>
<body>

  <div class="login-card">
    <h1>botpanel</h1>
    <p>Enter the panel password to continue.</p>
    
    <form action="/login" method="POST">
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" class="input-field" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn-primary">Sign in</button>
    </form>
  </div>

</body>
</html>
