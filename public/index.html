<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>botpanel</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap');

    :root {
      --bg-sidebar: #0c0e14;
      --bg-main: #14161f;
      --bg-card: #191c28;
      --bg-card-raised: #1f2331;
      --line: #272b3a;
      --text-primary: #e7e9f0;
      --text-dim: #7b8093;
      --text-faint: #4d5266;
      --accent: #4c7cf1;
      --accent-hover: #6690f5;
      --green: #2fd672;
      --amber: #f5a623;
      --red: #f0505a;
      --gray: #5c6178;
      --font-ui: 'Nunito Sans', system-ui, -apple-system, sans-serif;
      --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Consolas, monospace;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg-main) !important;
      color: var(--text-primary) !important;
      font-family: var(--font-ui);
    }

    button { font-family: inherit; }

    .shell { display: flex; min-height: 100vh; }

    .sidebar {
      width: 240px;
      flex-shrink: 0;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      padding: 20px 14px;
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 8px 22px 8px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 18px;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: linear-gradient(145deg, var(--accent), #2e56c9);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      flex-shrink: 0;
    }

    .brand-text { font-weight: 800; font-size: 15px; letter-spacing: -0.01em; }

    .sidebar-nav { flex: 1; display: flex; flex-direction: column; gap: 2px; }

    .nav-section-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-faint);
      padding: 14px 10px 6px 10px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 7px;
      color: var(--text-dim);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: background 0.12s ease, color 0.12s ease;
      cursor: pointer;
    }

    .nav-item svg { flex-shrink: 0; opacity: 0.85; }

    .nav-item:hover { background: var(--bg-card); color: var(--text-primary); }

    .nav-item.active {
      background: rgba(76, 124, 241, 0.14);
      color: var(--accent-hover);
    }

    .sidebar-signout {
      display: flex;
      align-items: center;
      gap: 10px;
      background: none;
      border: none;
      color: var(--text-faint);
      font-size: 13px;
      font-weight: 600;
      padding: 10px;
      cursor: pointer;
      border-radius: 7px;
      transition: background 0.12s ease, color 0.12s ease;
    }

    .sidebar-signout:hover { background: rgba(240, 80, 90, 0.1); color: var(--red); }

    .main { flex: 1; padding: 26px 34px 40px 34px; min-width: 0; }

    .server-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .server-identity { display: flex; align-items: center; gap: 14px; }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--gray);
      box-shadow: 0 0 0 4px transparent;
      transition: background 0.2s ease;
      flex-shrink: 0;
    }

    .status-dot[data-state="running"] {
      background: var(--green);
      box-shadow: 0 0 0 4px rgba(47, 214, 114, 0.16);
      animation: pulse-glow 2s ease-in-out infinite;
    }

    .status-dot[data-state="stopped"] { background: var(--gray); }

    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 0 4px rgba(47, 214, 114, 0.16); }
      50% { box-shadow: 0 0 0 7px rgba(47, 214, 114, 0.08); }
    }

    .server-identity h1 { margin: 0; font-size: 19px; font-weight: 800; letter-spacing: -0.01em; }

    .server-sub { font-family: var(--font-mono); font-size: 12px; color: var(--text-dim); }

    .power-trio { display: flex; gap: 8px; }

    .power-btn {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--bg-card);
      color: var(--text-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.12s ease;
    }

    .power-btn:hover:not(:disabled) { transform: translateY(-1px); }
    .power-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .power-start:hover:not(:disabled) { border-color: var(--green); color: var(--green); }
    .power-restart:hover:not(:disabled) { border-color: var(--amber); color: var(--amber); }
    .power-stop:hover:not(:disabled) { border-color: var(--red); color: var(--red); }

    .stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .stat-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-faint);
    }

    .stat-value { font-family: var(--font-mono); font-size: 16px; font-weight: 500; }

    .console-card { background: var(--bg-card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }

    .console-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
    }

    .console-toolbar-bottom { border-bottom: none; border-top: 1px solid var(--line); }

    .console-title { font-size: 13px; font-weight: 700; color: var(--text-dim); }

    .ghost-btn {
      background: none;
      border: 1px solid var(--line);
      color: var(--text-dim);
      font-size: 12px;
      font-weight: 600;
      padding: 5px 11px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.12s ease;
    }

    .ghost-btn:hover { color: var(--text-primary); border-color: var(--text-faint); }

    .console-body {
      height: 440px;
      overflow-y: auto;
      padding: 12px 16px;
      font-family: var(--font-mono);
      font-size: 12.5px;
      line-height: 1.6;
      background: #0e1019;
    }

    .log-line { display: flex; gap: 10px; white-space: pre-wrap; word-break: break-word; }
    .log-ts { color: var(--text-faint); flex-shrink: 0; }
    .log-tag { flex-shrink: 0; width: 52px; text-transform: uppercase; font-size: 10px; font-weight: 700; padding-top: 2px; }
    .log-tag.stdout { color: var(--text-dim); }
    .log-tag.stderr { color: var(--red); }
    .log-tag.system { color: var(--accent-hover); }
    .log-msg { color: var(--text-primary); }

    .config-textarea {
      width: 100%;
      min-height: 380px;
      border: none;
      background: #0e1019;
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 12.5px;
      line-height: 1.6;
      padding: 16px;
      resize: vertical;
      outline: none;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: none;
      font-size: 13px;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 7px;
      cursor: pointer;
      transition: background 0.12s ease;
    }

    .btn-primary:hover { background: var(--accent-hover); }

    /* File Manager Styles */
    .file-list {
      display: flex;
      flex-direction: column;
      background: #0e1019;
      min-height: 380px;
    }

    .file-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-bottom: 1px solid var(--line);
      font-family: var(--font-mono);
      font-size: 13px;
    }

    .file-row:hover { background: var(--bg-card); }

    .file-info {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      color: var(--text-primary);
    }

    .file-actions { display: flex; gap: 6px; }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--bg-card-raised);
      border: 1px solid var(--line);
      color: var(--text-primary);
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      transform: translateY(6px);
      pointer-events: none;
      transition: all 0.2s ease;
    }

    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.show.success { border-color: var(--green); }
    .toast.show.error { border-color: var(--red); }

    @media (max-width: 760px) {
      .shell { flex-direction: column; }
      .sidebar { width: 100%; flex-direction: row; align-items: center; padding: 10px 14px; }
      .sidebar-brand { border: none; margin: 0; padding: 0; }
      .sidebar-nav { flex-direction: row; }
      .nav-section-label, .sidebar-signout { display: none; }
      .main { padding: 18px; }
      .stat-row { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
        </div>
        <span class="brand-text">BotPanel</span>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-label">Management</div>
        <a href="#console" class="nav-item active" id="nav-console" onclick="switchView('console')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line>
          </svg>
          Console & Logs
        </a>
        <a href="#files" class="nav-item" id="nav-files" onclick="switchView('files')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
          </svg>
          Files & Folders
        </a>
        <a href="#config" class="nav-item" id="nav-config" onclick="switchView('config')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          Config (config.json)
        </a>
      </nav>

      <button class="sidebar-signout" onclick="window.location.href='/login.html'">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        Sign Out
      </button>
    </aside>

    <main class="main">
      <header class="server-header">
        <div class="server-identity">
          <div class="status-dot" id="statusDot" data-state="stopped"></div>
          <div>
            <h1 id="botTitle">botpanel</h1>
            <div class="server-sub">python3 bot.py</div>
          </div>
        </div>

        <div class="power-trio">
          <button class="power-btn power-start" id="startBtn" onclick="sendAction('start')" title="Start Bot">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
          </button>
          <button class="power-btn power-restart" id="restartBtn" onclick="sendAction('restart')" title="Restart Bot">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 4v6h-6"></path><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
          </button>
          <button class="power-btn power-stop" id="stopBtn" onclick="sendAction('stop')" title="Stop Bot" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"></rect></svg>
          </button>
        </div>
      </header>

      <section class="stat-row">
        <div class="stat-card">
          <span class="stat-label">Status</span>
          <span class="stat-value" id="statusVal">STOPPED</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">PID</span>
          <span class="stat-value" id="pidVal">—</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Uptime</span>
          <span class="stat-value" id="uptimeVal">—</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Restarts</span>
          <span class="stat-value" id="restartsVal">0</span>
        </div>
      </section>

      <div id="view-console" class="view">
        <div class="console-card">
          <div class="console-toolbar">
            <span class="console-title">Log Stream</span>
            <div style="display: flex; gap: 8px;">
              <button class="ghost-btn" id="pauseBtn" onclick="togglePauseLog()">Pause</button>
              <button class="ghost-btn" onclick="clearLog()">Clear</button>
            </div>
          </div>
          <div class="console-body" id="consoleBody"></div>
        </div>
      </div>

      <div id="view-files" class="view" style="display: none;">
        <div class="console-card">
          <div class="console-toolbar">
            <span class="console-title" id="fileManagerTitle">File Manager (/bot)</span>
            <div style="display: flex; gap: 8px;">
              <button class="ghost-btn" onclick="createNewFile()">+ New File</button>
              <button class="ghost-btn" onclick="fetchFiles()">Refresh</button>
            </div>
          </div>
          
          <div id="fileExplorer">
            <div class="file-list" id="fileListBody"></div>
          </div>

          <div id="fileEditorContainer" style="display: none;">
            <textarea id="fileEditorInput" class="config-textarea" spellcheck="false"></textarea>
            <div class="console-toolbar console-toolbar-bottom">
              <button class="ghost-btn" onclick="closeFileEditor()">Back to Files</button>
              <button class="btn-primary" onclick="saveActiveFile()">Save File</button>
            </div>
          </div>
        </div>
      </div>

      <div id="view-config" class="view" style="display: none;">
        <div class="console-card">
          <div class="console-toolbar">
            <span class="console-title">Configuration Editor</span>
            <span style="font-size: 12px; color: var(--text-dim);" id="configStatus">Loading config.json...</span>
          </div>
          <textarea id="configInput" class="config-textarea" spellcheck="false" placeholder="{}"></textarea>
          <div class="console-toolbar console-toolbar-bottom">
            <div></div>
            <button class="btn-primary" onclick="saveConfig()">Save Changes</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let isLogPaused = false;
    let activeEditingFileName = null;

    function switchView(viewName) {
      document.getElementById('view-console').style.display = viewName === 'console' ? 'block' : 'none';
      document.getElementById('view-files').style.display = viewName === 'files' ? 'block' : 'none';
      document.getElementById('view-config').style.display = viewName === 'config' ? 'block' : 'none';
      
      document.getElementById('nav-console').classList.toggle('active', viewName === 'console');
      document.getElementById('nav-files').classList.toggle('active', viewName === 'files');
      document.getElementById('nav-config').classList.toggle('active', viewName === 'config');

      if (viewName === 'files') {
        fetchFiles();
      }
    }

    function sendAction(action) {
      socket.emit(action);
      showToast(`Command '${action}' dispatched.`, 'success');
    }

    socket.on('status', (data) => {
      const state = data.status.toLowerCase();
      document.getElementById('statusDot').setAttribute('data-state', state);
      document.getElementById('statusVal').innerText = data.status;
      document.getElementById('pidVal').innerText = data.pid;
      document.getElementById('uptimeVal').innerText = data.uptime;
      document.getElementById('restartsVal').innerText = data.restarts;

      document.getElementById('startBtn').disabled = (data.status === 'RUNNING');
      document.getElementById('stopBtn').disabled = (data.status === 'STOPPED');
    });

    socket.on('log', (data) => {
      if (isLogPaused) return;
      const consoleBody = document.getElementById('consoleBody');
      const line = document.createElement('div');
      line.className = 'log-line';
      const timeStr = new Date().toLocaleTimeString();
      const type = data.type || 'stdout';

      line.innerHTML = `
        <span class="log-ts">${timeStr}</span>
        <span class="log-tag ${type}">${type}</span>
        <span class="log-msg">${escapeHtml(data.message)}</span>
      `;
      consoleBody.appendChild(line);
      consoleBody.scrollTop = consoleBody.scrollHeight;
    });

    function togglePauseLog() {
      isLogPaused = !isLogPaused;
      document.getElementById('pauseBtn').innerText = isLogPaused ? 'Resume' : 'Pause';
    }

    function clearLog() {
      document.getElementById('consoleBody').innerHTML = '';
    }

    /* --- File Manager API Calls --- */
    async function fetchFiles() {
      closeFileEditor();
      try {
        const res = await fetch('/api/files');
        const files = await res.json();
        const listContainer = document.getElementById('fileListBody');
        listContainer.innerHTML = '';

        if (files.length === 0) {
          listContainer.innerHTML = '<div class="file-row" style="color: var(--text-dim);">No files found in bot folder.</div>';
          return;
        }

        files.forEach(file => {
          const row = document.createElement('div');
          row.className = 'file-row';
          row.innerHTML = `
            <div class="file-info" onclick="editFile('${file.name}')">
              📄 <span>${escapeHtml(file.name)}</span>
            </div>
            <div class="file-actions">
              <button class="ghost-btn" onclick="editFile('${file.name}')">Edit</button>
              <button class="ghost-btn" style="color: var(--red);" onclick="deleteFile('${file.name}')">Delete</button>
            </div>
          `;
          listContainer.appendChild(row);
        });
      } catch (err) {
        showToast('Failed to load file list.', 'error');
      }
    }

    async function editFile(filename) {
      try {
        const res = await fetch(`/api/files/read?name=${encodeURIComponent(filename)}`);
        const data = await res.json();
        activeEditingFileName = filename;
        document.getElementById('fileEditorInput').value = data.content;
        document.getElementById('fileManagerTitle').innerText = `Editing: ${filename}`;
        document.getElementById('fileExplorer').style.display = 'none';
        document.getElementById('fileEditorContainer').style.display = 'block';
      } catch (err) {
        showToast('Failed to open file.', 'error');
      }
    }

    function closeFileEditor() {
      activeEditingFileName = null;
      document.getElementById('fileManagerTitle').innerText = 'File Manager (/bot)';
      document.getElementById('fileExplorer').style.display = 'block';
      document.getElementById('fileEditorContainer').style.display = 'none';
    }

    async function saveActiveFile() {
      if (!activeEditingFileName) return;
      const content = document.getElementById('fileEditorInput').value;
      try {
        const res = await fetch('/api/files/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: activeEditingFileName, content })
        });
        const data = await res.json();
        if (data.success) {
          showToast(`Saved ${activeEditingFileName}`, 'success');
        } else {
          showToast('Failed to save file.', 'error');
        }
      } catch (err) {
        showToast('Server error while saving.', 'error');
      }
    }

    async function createNewFile() {
      const filename = prompt("Enter new filename (e.g. cogs.py or settings.json):");
      if (!filename) return;

      try {
        const res = await fetch('/api/files/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: filename, content: '' })
        });
        const data = await res.json();
        if (data.success) {
          showToast(`File created: ${filename}`, 'success');
          fetchFiles();
        }
      } catch (err) {
        showToast('Failed to create file.', 'error');
      }
    }

    async function deleteFile(filename) {
      if (!confirm(`Are you sure you want to delete ${filename}?`)) return;

      try {
        const res = await fetch('/api/files/delete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: filename })
        });
        const data = await res.json();
        if (data.success) {
          showToast(`Deleted ${filename}`, 'success');
          fetchFiles();
        }
      } catch (err) {
        showToast('Failed to delete file.', 'error');
      }
    }

    async function fetchConfig() {
      try {
        const res = await fetch('/api/config');
        const data = await res.json();
        document.getElementById('configInput').value = data.content || '';
        document.getElementById('configStatus').innerText = data.exists ? 'config.json loaded.' : 'No config.json yet.';
      } catch (err) {
        document.getElementById('configStatus').innerText = 'Failed to load configuration.';
      }
    }

    async function saveConfig() {
      const content = document.getElementById('configInput').value;
      try {
        const res = await fetch('/api/config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content })
        });
        const data = await res.json();
        if (data.success) {
          showToast('Configuration saved successfully.', 'success');
        } else {
          showToast('Failed to save config.', 'error');
        }
      } catch (err) {
        showToast('Server error while saving.', 'error');
      }
    }

    function showToast(msg, type = '') {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.className = `toast show ${type}`;
      setTimeout(() => { toast.className = 'toast'; }, 3000);
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    fetchConfig();
  </script>
</body>
</html>
