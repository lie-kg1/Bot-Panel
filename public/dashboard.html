<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>botpanel — console</title>
<link rel="stylesheet" href="/pterodactyl.css" />
</head>
<body>

  <div class="shell">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2 3 7v10l9 5 9-5V7l-9-5Z" />
            <path d="M12 12 3 7m9 5 9-5m-9 5v10" />
          </svg>
        </div>
        <span class="brand-text">botpanel</span>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-label">Server</div>
        <a href="#" class="nav-item active" data-view="console">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="m4 17 6-6-6-6M12 19h8"/></svg>
          Console
        </a>
        <a href="#" class="nav-item" data-view="startup">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 21V4a1 1 0 0 1 1-1h9l5 5v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1Z"/><path d="M14 3v5h5M8 13h8M8 17h5"/></svg>
          Startup
        </a>

        <div class="nav-section-label">Panel</div>
        <a href="/index.html" class="nav-item nav-item-muted">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
          Classic view
        </a>
      </nav>

      <button class="sidebar-signout" id="logout-btn">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        Sign out
      </button>
    </aside>

    <!-- Main -->
    <div class="main">

      <header class="server-header">
        <div class="server-identity">
          <span class="status-dot" id="status-dot" data-state="stopped"></span>
          <div>
            <h1 id="server-name">bot</h1>
            <span class="server-sub" id="server-cmd">—</span>
          </div>
        </div>

        <div class="power-trio">
          <button class="power-btn power-start" id="start-btn" title="Start">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M8 5v14l11-7L8 5Z"/></svg>
          </button>
          <button class="power-btn power-restart" id="restart-btn" title="Restart">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/></svg>
          </button>
          <button class="power-btn power-stop" id="stop-btn" title="Stop">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>
          </button>
        </div>
      </header>

      <!-- Console view -->
      <section class="view" id="view-console">

        <div class="stat-row">
          <div class="stat-card">
            <span class="stat-label">Status</span>
            <span class="stat-value" id="stat-status">Stopped</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">PID</span>
            <span class="stat-value" id="stat-pid">—</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">Uptime</span>
            <span class="stat-value" id="stat-uptime">—</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">Restarts</span>
            <span class="stat-value" id="stat-restarts">0</span>
          </div>
        </div>

        <div class="console-card">
          <div class="console-toolbar">
            <span class="console-title">Console output</span>
            <div class="console-actions">
              <button id="log-pause" class="ghost-btn">Pause</button>
              <button id="log-clear" class="ghost-btn">Clear</button>
            </div>
          </div>
          <div class="console-body" id="log-stream" aria-live="polite"></div>
        </div>

      </section>

      <!-- Startup / config view -->
      <section class="view" id="view-startup" hidden>
        <div class="console-card">
          <div class="console-toolbar">
            <span class="console-title">config.json</span>
            <span class="config-status" id="config-status"></span>
          </div>
          <textarea class="config-textarea" id="config-textarea" spellcheck="false" placeholder="No config.json found in bot directory yet."></textarea>
          <div class="console-toolbar console-toolbar-bottom">
            <button class="btn-primary" id="config-save">Save changes</button>
          </div>
        </div>
      </section>

    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/dashboard.js"></script>
</body>
</html>
